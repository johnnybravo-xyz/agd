[[bin]]
name = "org-mcp-server"
path = "src/main.rs"

[dependencies]
org-core = { package = "agd-core", version = "0.0.1", path = "../org-core" }
rmcp.workspace = true
tokio = { workspace = true, features = [
  "io-std",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "std",
  "fmt",
] }
urlencoding = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
config = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
test-utils = { path = "../test-utils" }
tokio-test = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
serial_test = { workspace = true }
temp-env = "0.3.6"
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[package]
name = "org-mcp-server"
description = "Model Context Protocol (MCP) server providing AI assistants with access to org-mode knowledge bases through search, content retrieval, and ID-based lookups"
edition = "2024"
authors.workspace = true
license.workspace = true
version = "0.1.1"
readme.workspace = true
documentation.workspace = true
repository.workspace = true
