name: Conformance
on:
  pull_request:
    branches: [main]
    paths: &paths
      - "agd/readers/**"
      - "conformance/**"
      - "scripts/*oracle.py"
      - "scripts/fetch-*.sh"
      - ".github/workflows/conformance.yml"
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Checks the fixtures against pinned Emacs and Neovim; CI's tests check agd
  # against the same fixtures.
  oracles:
    name: Editor oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/fetch-neovim-oracle.sh
      - name: Compare the fixtures with pinned Emacs and Neovim
        env:
          NVIM: ${{ github.workspace }}/target/nvim-0.12.6/bin/nvim
        run: |
          ./scripts/emacs-agenda-oracle.py
          ./scripts/emacs-edit-oracle.py
          ./scripts/emacs-import-oracle.py
          ./scripts/nvim-import-oracle.py

  corpus:
    name: Org and Worg corpus
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: ./scripts/fetch-conformance-corpus.sh
      - name: Round-trip the corpus
        env:
          AGD_CONFORMANCE_CORPUS: ${{ github.workspace }}/target/conformance-corpus
        run: cargo test -p agd-core --test conformance_roundtrip
