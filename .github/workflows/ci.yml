name: CI
on:
  pull_request:
    branches: [main]
    paths: &paths
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/*.rs"
      - "agd/readers/**"
      - "agd/claude-plugin/**"
      - "conformance/**"
      - "deny.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths: *paths
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      # Every test binary runs, so one run shows all of a platform's failures.
      - run: cargo test --workspace --all-targets --all-features --no-fail-fast

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Licenses, sources, bans and RustSec advisories
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@v0.9.2

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - run: nix build .#agd --print-build-logs
