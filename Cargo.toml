[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
  "johnnybravo-xyz",
  "Sebastián Zaffarano <sebas@zaffarano.com.ar>",
]
license = "GPL-3.0-or-later"
repository = "https://github.com/johnnybravo-xyz/agd"
homepage = "https://github.com/johnnybravo-xyz/agd"
documentation = "https://github.com/johnnybravo-xyz/agd"
readme = "README.md"


[workspace]
resolver = "3"
members = ["agd", "org-core"]
exclude = ["fuzz"]

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.1"
csv = "1.4"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
globset = "0.4"
ignore = "0.4"
orgize = { version = "=0.10.0-alpha.10", features = ["tracing"] }
predicates = "3.1"
regex = "1.12"
notify = "8.2"
rmcp = { version = "3.5.1", features = ["transport-io"] }
rowan = "0.15"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
similar = "2.7"
serial_test = "3.2"
shellexpand = "3.1.2"
tempfile = "3.26"
temp-env = "0.3.6"
tokio = "1"
toml = "1.0"
tracing = "0.1.44"
unicode-width = "0.2"
uuid = { version = "1.18", features = ["v4"] }
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "std",
  "fmt",
] }

[workspace.metadata.coverage]
exclude = ["*/tests/*", "*/benches/*", "**/target/**"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
