# Two terminals for the story: Claude Code, then agd.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g escape-time 0
set -g mouse on
set -g focus-events on
set -g status-position top
set -g status-style "bg=#14171c,fg=#808896"
set -g status-left ""
set -g status-right ""
set -g window-status-format "  #W  "
set -g window-status-current-format "#[fg=#14171c,bg=#6ea8fe,bold]  #W  "
set -g window-status-separator " "
set -g base-index 1
