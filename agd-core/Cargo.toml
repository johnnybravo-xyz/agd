[dependencies]
chrono = { workspace = true, features = ["serde"] }
dirs.workspace = true
globset.workspace = true
ignore.workspace = true
orgize.workspace = true
regex.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
similar.workspace = true
sha2.workspace = true
shellexpand.workspace = true
toml.workspace = true
tempfile.workspace = true
uuid.workspace = true
unicode-width.workspace = true

[lib]
name = "agd_core"
path = "src/lib.rs"

[package]
name = "agd-core"
description = "Org-mode parsing and task operations for agd"
edition = "2024"
rust-version = "1.89"
authors.workspace = true
license.workspace = true
version = "0.2.0"
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agd-core"
repository.workspace = true
keywords = ["org-mode", "agenda", "productivity"]
categories = ["parser-implementations"]
# The conformance tests read ../conformance, which is not in this crate.
exclude = ["tests/"]
