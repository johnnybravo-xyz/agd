[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
crossterm.workspace = true
csv.workspace = true
notify.workspace = true
agd-core = { version = "0.2.0", path = "../agd-core" }
rmcp.workspace = true
ratatui.workspace = true
serde = { workspace = true, features = ["derive"] }
# preserve_order: `setup install` rewrites opencode.json with its keys in
# the person's order.
serde_json = { workspace = true, features = ["preserve_order"] }
similar.workspace = true
tokio = { workspace = true, features = ["io-std", "rt-multi-thread", "signal", "sync"] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile.workspace = true
unicode-width.workspace = true

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serial_test = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "time"] }

[package]
name = "agd"
description = "An org-agenda for the terminal and for coding agents"
edition = "2024"
rust-version = "1.89"
authors.workspace = true
license.workspace = true
version = "0.2.0"
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
keywords = ["org-mode", "agenda", "productivity", "cli", "knowledge-management"]
categories = ["command-line-utilities"]
# The binary embeds only the plugin's skill (`agd setup install`); the rest
# of the Claude Code plugin ships through its marketplace, not this crate.
exclude = ["claude-plugin/*", "!claude-plugin/skills/"]

[[bin]]
name = "agd"
path = "src/main.rs"
