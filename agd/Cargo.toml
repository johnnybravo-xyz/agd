[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossterm.workspace = true
csv.workspace = true
notify.workspace = true
org-core = { package = "agd-core", version = "0.0.1", path = "../org-core" }
rmcp.workspace = true
ratatui.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
similar.workspace = true
tokio = { workspace = true, features = ["io-std", "rt-multi-thread", "signal", "sync"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile.workspace = true

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serial_test = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
test-utils = { path = "../test-utils" }
tokio = { workspace = true, features = ["macros", "process", "time"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }

[package]
name = "agd"
description = "Local-first CLI and stdio MCP server for org-mode files"
edition = "2024"
rust-version = "1.89"
authors.workspace = true
license.workspace = true
version = "0.0.1"
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
keywords = ["org-mode", "agenda", "productivity", "cli", "knowledge-management"]
categories = ["command-line-utilities"]

[[bin]]
name = "agd"
path = "src/main.rs"
